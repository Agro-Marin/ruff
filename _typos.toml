[files]
extend-exclude = [
    "crates/ty_vendored/vendor/**/*",
    "crates/ruff_unicode_names2/data/NameAliases.txt",
    "crates/ruff_unicode_names2/data/UnicodeData.txt",
    "**/resources/**/*",
    "**/snapshots/**/*",
    "crates/ruff_linter/src/rules/flake8_implicit_str_concat/rules/collection_literal.rs",
    "crates/ty_ide/src/completion.rs",
    "crates/ty_python_semantic/src/diagnostic/levenshtein.rs",
]

[default.extend-words]
"arange" = "arange"
hel = "hel"
whos = "whos"
spawnve = "spawnve"
ned = "ned"
pn = "pn"
poit = "poit"
BA = "BA"
jod = "jod"
CPY = "CPY"

[default]
extend-ignore-re = [
    "(?Rm)^.*#\\s*spellchecker:disable-line$",
    "LICENSEs",
    "typ",
    "TYP",
    "ntBre"
]

[default.extend-identifiers]
"FrIeNdLy" = "FrIeNdLy"
