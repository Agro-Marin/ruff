[test-groups]
serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(file_watching)'
test-group = 'serial'

[profile.ci]
failure-output = "immediate-final"
fail-fast = false

status-level = "skip"

slow-timeout =  { period = "1s", terminate-after = 60 }

final-status-level = "slow"
