[bans]
multiple-versions = "allow"

external-default-features = "allow"

[bans.build]
allow-build-scripts = [
    "alloca",
    "anyhow",
    "camino",
    "codspeed",
    "codspeed-criterion-compat",
    "codspeed-divan-compat",
    "constant_time_eq",
    "crc32fast",
    "crossbeam-utils",
    "crunchy",
    "escargot",
    "fs-err",
    "generic-array",
    "getrandom",
    "icu_normalizer_data",
    "icu_properties_data",
    "libc",
    "libm",
    "libmimalloc-sys",
    "memoffset",
    "minicov",
    "nix",
    "num-traits",
    "objc2",
    "object",
    "parking_lot_core",
    "paste",
    "portable-atomic",
    "portable-atomic-util",
    "proc-macro2",
    "psm",
    "quote",
    "radium",
    "rayon-core",
    "ref-cast",
    "rustix",
    "rustversion",
    "serde",
    "serde_core",
    "serde_json",
    "stacker",
    "terminfo",
    "thiserror",
    "tikv-jemalloc-sys",
    "typeid",
    "typenum",
    "wasm-bindgen",
    "wasm-bindgen-shared",
    "winapi",
    "winapi-i686-pc-windows-gnu",
    "winapi-x86_64-pc-windows-gnu",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_gnullvm",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",
    "wit-bindgen",
    "zmij",
    "zstd-safe",
    "zstd-sys",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.95
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PSF-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "WTFPL",
]
