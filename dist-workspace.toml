[workspace]
members = ["cargo:."]
packages = ["ruff"]

[dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.31.0"
dist = false
ci = "github"
installers = ["shell", "powershell"]
windows-archive = ".zip"
unix-archive = ".tar.gz"
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-pc-windows-msvc",
    "arm-unknown-linux-musleabihf",
    "armv7-unknown-linux-gnueabihf",
    "armv7-unknown-linux-musleabihf",
    "x86_64-apple-darwin",
    "powerpc64le-unknown-linux-gnu",
    "riscv64gc-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "i686-unknown-linux-gnu",
    "i686-unknown-linux-musl",
    "i686-pc-windows-msvc"
]
auto-includes = false
create-release = true
pr-run-mode = "plan"
dispatch-releases = true
github-release = "announce"
github-attestations = true
github-attestations-phase = "announce"
github-attestations-filters = ["*.json", "*.sh", "*.ps1", "*.zip", "*.tar.gz"]
build-local-artifacts = false
local-artifacts-jobs = ["./build-binaries", "./build-docker", "./build-wasm"]
publish-jobs = ["./publish-pypi", "./publish-wasm", "./publish-crates"]
post-announce-jobs = ["./notify-dependents", "./publish-docs", "./publish-playground", "./publish-versions", "./publish-mirror"]
github-custom-job-permissions = { "build-binaries" = { contents = "read" }, "build-docker" = { packages = "write", contents = "read", id-token = "write", attestations = "write" }, "build-wasm" = { contents = "read" }, "publish-wasm" = { contents = "read", id-token = "write", packages = "write" }, "publish-crates" = { contents = "read" }, "publish-playground" = { contents = "read" }, "notify-dependents" = { id-token = "write" }, "publish-docs" = { contents = "read", id-token = "write" }, "publish-versions" = { contents = "read", id-token = "write" }, "publish-mirror" = { contents = "read" } }
install-updater = false
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
hosting = ["simple", "github"]
simple-download-url = "https://releases.astral.sh/github/ruff/releases/download/{tag}"

[dist.github-custom-runners]
global = "depot-ubuntu-24.04-4"

[dist.github-action-commits]
"actions/checkout" = "de0fac2e4500dabe0009e67214ff5f5447ce83dd"
"actions/upload-artifact" = "bbbca2ddaa5d8feaa63e36b76fdaad77386f024f"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/attest-build-provenance" = "a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32"
