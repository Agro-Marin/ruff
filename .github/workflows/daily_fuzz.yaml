name: Daily parser fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - ".github/workflows/daily_fuzz.yaml"
      - ".github/actions/setup-ruff-workspace/action.yml"
      - "python/py-fuzzer/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_LTO: "false"
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  PACKAGE_NAME: ruff
  FORCE_COLOR: 1

jobs:
  fuzz:
    name: Fuzz
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      FUZZ_JOB_TIMEOUT_MINUTES: 20
    permissions:
      contents: read
    outputs:
      issue-report: ${{ steps.upload_report.outputs.artifact-id }}
    if: ${{ github.repository == 'astral-sh/ruff' || github.event_name != 'schedule' }}
    steps:
      - name: Record job start time
        run: echo "FUZZ_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: auto
      - name: "Install Rust toolchain"
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build ruff
        run: cargo build --locked
      - name: Fuzz
        id: fuzz
        run: |
          issue_options=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            issue_options+=(--write-github-issue="$RUNNER_TEMP/fuzz-issue.md")
          fi
          # shellcheck disable=SC2046
          (
            uv run \
            --python=3.14 \
            --project=./python/py-fuzzer \
            --locked \
            fuzz \
            --test-executable=target/debug/ruff \
            --budget-minutes="${FUZZ_JOB_TIMEOUT_MINUTES}" \
            --job-started-at="${FUZZ_JOB_STARTED_AT}" \
            --bin=ruff \
            "${issue_options[@]}" \
            $(shuf -i 0-9999999999999999999 -n 1000)
          )
      - name: Upload the fuzz report
        id: upload_report
        if: ${{ failure() && github.event_name == 'schedule' && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daily-fuzz-issue
          path: ${{ runner.temp }}/fuzz-issue.md
          if-no-files-found: ignore

  create-issue-on-failure:
    name: Report a failed fuzz run
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    needs: fuzz
    if: ${{ github.repository == 'astral-sh/ruff' && always() && github.event_name == 'schedule' && needs.fuzz.result != 'success' }}
    permissions:
      issues: write
    steps:
      - name: Download the fuzz report
        id: download_report
        if: ${{ needs.fuzz.outputs.issue-report != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: daily-fuzz-issue
          path: ${{ runner.temp }}/fuzz-report
      - name: Create an issue for the failed fuzz run
        if: ${{ !cancelled() }}
        env:
          REPORT_DOWNLOAD_OUTCOME: ${{ steps.download_report.outcome }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = {
              owner: "astral-sh",
              repo: "ruff",
              title: `Daily parser fuzz failed on ${new Date().toDateString()}`,
              labels: ["bug", "parser", "fuzzer"],
            };
            const fallbackBody = "Run listed here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            const createIssue = (body) => github.rest.issues.create({ ...issue, body });

            if (process.env.REPORT_DOWNLOAD_OUTCOME === "success") {
              try {
                const report = require("node:fs").readFileSync(`${process.env.RUNNER_TEMP}/fuzz-report/fuzz-issue.md`, "utf8");
                await createIssue(report);
                return;
              } catch (error) {
                core.error(error);
                await createIssue(fallbackBody);
                throw error;
              }
            }
            await createIssue(fallbackBody);
