name: Run memory report

permissions:
  contents: read

cache-mode: read

on:
  pull_request:
    paths:
      - "crates/ty*/**"
      - "!crates/ty_ide/**"
      - "!crates/ty_server/**"
      - "!crates/ty_test/**"
      - "!crates/ty_completion_eval/**"
      - "!crates/ty_wasm/**"
      - "crates/ruff_db/**"
      - "crates/ruff_python_ast/**"
      - "crates/ruff_python_edits/**"
      - "crates/ruff_python_parser/**"
      - "scripts/memory_report.py"
      - ".github/workflows/memory_report.yaml"
      - ".github/actions/setup-ruff-workspace/action.yml"
      - "Cargo.lock"
      - "!**.md"
      - "!**.snap"
      - "!crates/ty_python_semantic/resources/corpus/**"

concurrency:
  group: memory-report-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  CARGO_PROFILE_PROFILING_DEBUG: line-tables-only
  PYTHON_VERSION: 3.14

jobs:
  memory_report:
    name: Compute memory usage diff
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-32' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ruff
          persist-credentials: false

      - name: Fetch full history without tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git -C ruff fetch --no-tags --filter=blob:none --unshallow origin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "ruff"
          save-if: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: $/.github/actions/setup-ruff-workspace
        with:
          enable-cache: true
          save-cache: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Compute memory usage diff
        shell: bash
        env:
          TY_MEMORY_REPORT: json
          TY_MAX_PARALLELISM: 1
        run: |
          # Build the executable for the old and new commit
          (
            cd ruff

            echo "new commit"
            git rev-list --format=%s --max-count=1 "$GITHUB_SHA"
            cargo build --bin ty --profile profiling
            mv target/profiling/ty ty-new

            # The first parent contains any preceding layers in a stacked pull request.
            MERGE_BASE="$(git rev-parse "${GITHUB_SHA}^1")"
            git checkout -b old_commit "$MERGE_BASE"
            echo "old commit (merge base)"
            git rev-list --format=%s --max-count=1 old_commit
            cargo build --bin ty --profile profiling
            mv target/profiling/ty ty-old
          )

          (
            echo "Creating comment with memory comparison"
            cd ruff
            git switch - --detach

            python "./scripts/memory_report.py" run \
              --old-ty "./ty-old" \
              --new-ty "./ty-new" \
              --projects-dir "${GITHUB_WORKSPACE}/memory_projects" \
              --output ../memory_report_diff.diff
          )

      - name: Upload diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: memory_report_diff
          path: memory_report_diff.diff

  publish-report:
    needs: memory_report
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.repository == 'astral-sh/ruff' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.memory_report.result == 'success' || needs.memory_report.result == 'failure')
    uses: astral-sh/ruff/.github/workflows/publish-pull-request-report.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      KV_API_URL: ${{ secrets.KV_API_URL }}
      STS_API_URL: ${{ secrets.STS_API_URL }}
    permissions:
      contents: read
      id-token: write
    with:
      report: memory
      artifact: memory_report_diff
      filename: memory_report_diff.diff
