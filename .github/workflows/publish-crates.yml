name: "Publish to crates.io"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  UV_LOCKED: 1
  ACTIONS_CACHE_MODE: none

jobs:
  crates-publish-ruff:
    name: Upload Ruff to crates.io
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - name: Install nightly toolchain
        run: rustup toolchain install nightly-2026-06-12 --profile minimal --no-self-update
      - name: Publish workspace crates
        run: python3 scripts/publish-crates.py --cargo cargo +nightly-2026-06-12 --no-verify -- -Zpublish-timeout --config 'publish.timeout=600'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
