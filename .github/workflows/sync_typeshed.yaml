name: Sync typeshed


on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1,15 * *"

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

env:
  UV_LOCKED: 1

  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_LTO: "false"
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: "ci"
  RUSTUP_MAX_RETRIES: 10
  GH_TOKEN: ${{ github.token }}

  UPSTREAM_BRANCH: typeshedbot/sync-typeshed

  VENDORED_TYPESHED: crates/ty_vendored/vendor/typeshed

jobs:
  sync:
    name: Sync typeshed
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 20
    if: ${{ github.repository == 'astral-sh/ruff' || github.event_name != 'schedule' }}
    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout Ruff
        with:
          path: ruff
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout typeshed
        with:
          repository: python/typeshed
          path: typeshed
          persist-credentials: false
      - name: Setup git
        run: |
          git config --global user.name typeshedbot
          git config --global user.email '<>'
      - uses: $/.github/actions/setup-ruff-workspace
      - name: Sync typeshed stubs
        run: |
          rm -rf "ruff/${VENDORED_TYPESHED}"
          mkdir "ruff/${VENDORED_TYPESHED}"
          cp typeshed/README.md "ruff/${VENDORED_TYPESHED}"
          cp typeshed/LICENSE "ruff/${VENDORED_TYPESHED}"

          # The pyproject.toml file is needed by a later job for the black configuration.
          # It's deleted before creating the PR.
          cp typeshed/pyproject.toml "ruff/${VENDORED_TYPESHED}"

          cp -r typeshed/stdlib "ruff/${VENDORED_TYPESHED}/stdlib"
          rm -rf "ruff/${VENDORED_TYPESHED}/stdlib/@tests"
          git -C typeshed rev-parse HEAD > "ruff/${VENDORED_TYPESHED}/source_commit.txt"
          cd ruff
          git checkout -b "${UPSTREAM_BRANCH}"
          git add .
          git commit -m "Sync typeshed. Source commit: https://github.com/python/typeshed/commit/$(git -C ../typeshed rev-parse HEAD)" --allow-empty
      - name: Sync Linux docstrings
        if: ${{ success() }}
        env:
          FORCE_COLOR: 1
        run: |
          cd ruff
          ./scripts/codemod_docstrings.sh
          git commit -am "Sync Linux docstrings" --allow-empty
      - name: Get repository token
        id: token
        uses: astral-sh/github-actions/simple-token-service@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            contents: write
      - name: Push the changes
        id: commit
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git
          git -C ruff push --force --set-upstream origin "${UPSTREAM_BRANCH}"

  docstrings-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [sync]

    if: ${{ github.repository == 'astral-sh/ruff' || github.event_name != 'schedule' }}

    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout Ruff
        with:
          persist-credentials: false
          ref: ${{ env.UPSTREAM_BRANCH}}
      - uses: $/.github/actions/setup-ruff-workspace
      - name: Setup git
        run: |
          git config --global user.name typeshedbot
          git config --global user.email '<>'
      - name: Sync Windows docstrings
        id: docstrings
        env:
          FORCE_COLOR: 1
        run: ./scripts/codemod_docstrings.sh
      - name: Get repository token
        id: token
        uses: astral-sh/github-actions/simple-token-service@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            contents: write
      - name: Commit the changes
        if: ${{ steps.docstrings.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git commit -am "Sync Windows docstrings" --allow-empty
          gh auth setup-git
          git push

  docstrings-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    needs: [sync, docstrings-windows]

    if: ${{ github.repository == 'astral-sh/ruff' || github.event_name != 'schedule' }}

    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/github-actions/demudhra@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout Ruff
        with:
          persist-credentials: false
          ref: ${{ env.UPSTREAM_BRANCH}}
      - uses: $/.github/actions/setup-ruff-workspace
      - name: Setup git
        run: |
          git config --global user.name typeshedbot
          git config --global user.email '<>'
      - name: Sync macOS docstrings
        if: ${{ success() }}
        env:
          FORCE_COLOR: 1
        run: |
          ./scripts/codemod_docstrings.sh
          git commit -am "Sync macOS docstrings" --allow-empty
      - name: Format the changes
        if: ${{ success() }}
        env:
          FORCE_COLOR: 1
        run: |
          # Here we just reformat the codemodded stubs so that they are
          # consistent with the other typeshed stubs around them.
          # Typeshed formats code using black in their CI, so we just invoke
          # black on the stubs the same way that typeshed does.
          uv run \
            --locked \
            --only-group=typeshed-formatting \
            black "${VENDORED_TYPESHED}/stdlib" \
            --config "${VENDORED_TYPESHED}/pyproject.toml" || true
          git commit -am "Format codemodded docstrings" --allow-empty
      - name: Remove typeshed pyproject.toml file
        if: ${{ success() }}
        run: |
          rm "${VENDORED_TYPESHED}/pyproject.toml"
          git commit -am "Remove pyproject.toml file"
      - name: Get repository token
        id: token
        uses: astral-sh/github-actions/simple-token-service@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            contents: write
      - name: Push synced changes upstream
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git
          git push
      - name: Apply and push typeshed patches
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git apply --directory="${VENDORED_TYPESHED}" crates/ty_vendored/typeshed_patches/*.patch
          git add "${VENDORED_TYPESHED}"
          git commit -m "Apply typeshed patches"
          git push

  update-snapshots:
    name: Update snapshots
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-32' || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: [sync, docstrings-windows, docstrings-macos]
    outputs:
      base-sha: ${{ steps.checkout.outputs.commit }}
      artifact-id: ${{ steps.snapshots.outputs.artifact-id }}

    if: ${{ github.repository == 'astral-sh/ruff' || github.event_name != 'schedule' }}

    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout Ruff
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ env.UPSTREAM_BRANCH}}
      - name: "Install Rust toolchain"
        run: rustup show
      - uses: $/.github/actions/setup-ruff-workspace
      - name: Update snapshots
        continue-on-error: true
        env:
          CI: "0"
          MDTEST_UPDATE_SNAPSHOTS: "1"
        run: uv run --only-dev cargo insta test --accept --all-features --test-runner nextest --disable-nextest-doctest
      - name: Prepare snapshot changes
        run: |
          git add --update
          git diff --cached --binary > "${RUNNER_TEMP}/snapshot-updates.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        name: Upload snapshot changes
        id: snapshots
        with:
          name: typeshed-snapshot-updates
          path: ${{ runner.temp }}/snapshot-updates.patch
          if-no-files-found: error
          retention-days: 1

  create-pr:
    name: Create PR
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: [sync, docstrings-windows, docstrings-macos, update-snapshots]

    if: ${{ always() && needs.sync.result == 'success' && needs.docstrings-windows.result == 'success' && needs.docstrings-macos.result == 'success' && (github.repository == 'astral-sh/ruff' || github.event_name != 'schedule') }}

    environment:
      name: automations
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout Ruff
        if: ${{ needs.update-snapshots.outputs.artifact-id != '' }}
        with:
          persist-credentials: false
          ref: ${{ needs.update-snapshots.outputs.base-sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        name: Download snapshot changes
        if: ${{ needs.update-snapshots.outputs.artifact-id != '' }}
        with:
          name: typeshed-snapshot-updates
          path: ${{ runner.temp }}/snapshot-updates
      - name: Get repository token
        id: token
        uses: astral-sh/github-actions/simple-token-service@67dc9ee1ddc113eccd8116e7b949fb6cdcd89889
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/ruff
          permissions: |
            contents: write
            pull_requests: write
      - name: Commit and push snapshot changes
        # Treat generated changes as unreviewed contributions, including when running CI.
        if: ${{ needs.update-snapshots.outputs.artifact-id != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git config --global user.name typeshedbot
          git config --global user.email '<>'
          # Apply without staging so new files in the patch remain untracked.
          git apply --allow-empty "${RUNNER_TEMP}/snapshot-updates/snapshot-updates.patch"
          git add --update
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Update snapshots"
            gh auth setup-git
            git push origin "HEAD:${UPSTREAM_BRANCH}"
          fi

      - name: Create PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          pr_number="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head "${UPSTREAM_BRANCH}" --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${UPSTREAM_BRANCH}" --title "[ty] Sync vendored typeshed stubs" --body "" --label "ty"
          fi

  create-issue-on-failure:
    name: Create an issue if the typeshed sync failed
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    needs: [sync, docstrings-windows, docstrings-macos, create-pr]

    if: ${{ github.repository == 'astral-sh/ruff' && always() && github.event_name == 'schedule' && (needs.sync.result != 'success' || needs.docstrings-windows.result != 'success' || needs.docstrings-macos.result != 'success' || needs.create-pr.result != 'success') }}

    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: "astral-sh",
              repo: "ruff",
              title: `Automated typeshed sync failed on ${new Date().toDateString()}`,
              body: `Run listed here: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["bug", "ty"],
            })
